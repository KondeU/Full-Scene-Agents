# 必填：服务器名，会用在 MXID 和 federation 里
server_name: "sup.kdyx.net"

# 对外访问的 URL（客户端会用这个地址访问你的 homeserver）
public_baseurl: http://sup.kdyx.net:8888/

# 是否向 matrix.org 上报匿名使用统计，建议 false
report_stats: false

# Caddy / 反代 IP 段（允许传递 X-Forwarded-* 等头）
trusted_proxies:
  - 172.16.0.0/12

# 是否允许公开注册（测试环境可以打开）
enable_registration: false
# 通过共享密钥注册（脚本/自动化），生成方法同下方“随机生成方法”
registration_shared_secret: "e9141ec2f4a496a26be266f03a7670fda31d5182bf24290f74af032efc3322ec"

# 进程 PID 文件路径（容器里一般不用太在意）
pid_file: /data/homeserver.pid

# 日志配置（可以先不指定，Synapse 会用默认）
# log_config: "/data/sup.kdyx.net.log.config"

# 监听端口（这里给 8008，Caddy 反代到这个端口）
listeners:
  - port: 8008
    tls: false
    type: http
    bind_addresses: ['::', '0.0.0.0']
    x_forwarded: true
    resources:
      - names: [client, federation]
        compress: true

# 数据库（先用 SQLite，简单；生产环境建议换成 PostgreSQL）
database:
  name: "sqlite3"
  args:
    database: "/data/homeserver.db"

# 媒体存储目录
media_store_path: "/data/media_store"

# 签名密钥路径（如果目录下没有，Synapse 会自动生成）
signing_key_path: "/data/sup.kdyx.net.signing.key"

# 用来签发/校验访问令牌、SSO 短期登录令牌等，没配会有可被伪造 token 的漏洞（CVE‑2019‑5885），随机生成方法：生成一个 64 字符的随机密钥 openssl rand -hex 32
macaroon_secret_key: "ddf2a2a6bac941eafaa3b7c49607efda60da51a6c641de7ab972f97bbe2a7156"

# 允许所有来源（仅适合原型验证阶段），这将允许跨域请求，有安全风险
#allow_cors: true
